name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
        include:
          - compiler: gcc
            cxx: g++-14
            cc: gcc-14
            packages: g++-14 gcc-14
          - compiler: clang
            cxx: clang++-18
            cc: clang-18
            packages: clang-18 llvm-18 g++-14 libstdc++-14-dev

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev qt6-base-dev cmake ninja-build ${{ matrix.packages }}

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DDEOXDM_ENABLE_ASAN=ON \
          -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build --parallel

    - name: Run Test Suite
      run: ctest --test-dir build --output-on-failure
