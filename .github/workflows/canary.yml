# SPDX-License-Identifier: MIT
#
# Tests every pull request and push to main. When a push to main passes, the
# Release build is packaged and published as the rolling "canary" prerelease:
# the "canary" tag is moved to the new commit and the release assets are
# replaced.
name: Canary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Default for every job: read-only. The publish job asks for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
        include:
          - compiler: gcc
            cxx: g++-14
            cc: gcc-14
            packages: g++-14 gcc-14
          - compiler: clang
            cxx: clang++-19
            cc: clang-19
            packages: clang-19 llvm-19 g++-14 libstdc++-14-dev

    steps:
    # Pinned to a commit: a tag can be moved to point at different code.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev qt6-base-dev cmake ninja-build ${{ matrix.packages }}

    - name: Configure
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DDEOXDM_ENABLE_ASAN=ON \
          -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build --verbose

    - name: Test
      run: ctest --test-dir build --output-on-failure

  canary:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # One publish at a time; a newer push waits instead of interrupting a
    # half-finished upload.
    concurrency:
      group: canary-release
      cancel-in-progress: false
    env:
      PACKAGE: deox-dm-canary-linux-x86_64

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev qt6-base-dev cmake ninja-build g++-14 gcc-14

    - name: Configure
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DDEOXDM_BUILD_GUI=ON \
          -DDEOXDM_BUILD_ID="canary-${GITHUB_SHA::7}" \
          -DBUILD_TESTING=OFF

    - name: Build
      run: cmake --build build

    - name: Package
      run: |
        mkdir -p dist
        cmake --install build --strip --prefix "$PWD/stage/$PACKAGE"
        ./stage/$PACKAGE/bin/deox-dm --version
        tar -C stage -czf "dist/$PACKAGE.tar.gz" "$PACKAGE"
        (cd dist && sha256sum -- * > SHA256SUMS)
        cat dist/SHA256SUMS

    - name: Write release notes
      run: |
        {
          echo "Automated canary build of commit ${GITHUB_SHA::7} on \`main\`."
          echo
          echo "- Commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo
          echo "This prerelease is replaced on every push to \`main\`. It passed the test suite"
          echo "but is otherwise untested."
          echo
          echo "Built on Ubuntu 24.04 (glibc 2.39). Needs the system's libcurl (\`libcurl4\`) and,"
          echo "for \`deox-dm-gui\`, Qt 6 (\`libqt6widgets6\`)."
          echo
          echo '```'
          echo "sha256sum -c SHA256SUMS"
          echo "tar -xzf $PACKAGE.tar.gz"
          echo "./$PACKAGE/bin/deox-dm --version"
          echo '```'
        } > notes.md

    - name: Publish canary release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        title="Canary ${GITHUB_SHA::7}"
        if gh release view canary >/dev/null 2>&1; then
          # Move the tag (creating it if it was deleted), then replace assets.
          if gh api "repos/$GH_REPO/git/ref/tags/canary" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/canary" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/canary -f sha="$GITHUB_SHA"
          fi
          gh release upload canary dist/* --clobber
          gh release edit canary --title "$title" --notes-file notes.md --prerelease --draft=false
        else
          gh release create canary dist/* --target "$GITHUB_SHA" \
            --title "$title" --notes-file notes.md --prerelease
        fi
